services:
  smartats-db:
    image: postgres:16-alpine
    container_name: smartats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smartats}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartats} -d ${POSTGRES_DB:-smartats}"]
      interval: 10s
      timeout: 5s
      retries: 5

  smartats-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartats-web
    restart: unless-stopped
    depends_on:
      smartats-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-smartats}:${POSTGRES_PASSWORD}@smartats-db:5432/${POSTGRES_DB:-smartats}}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "8000:8000"
    volumes:
      - resumes_data:/app/backend/data/resumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  resumes_data:
