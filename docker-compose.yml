version: '3.8'

services:
  smartats-db:
    image: postgres:16-alpine
    container_name: smartats-postgres
    restart: always
    environment:
      POSTGRES_USER: smartats
      POSTGRES_PASSWORD: smartatspassword
      POSTGRES_DB: smartats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartats -d smartats"]
      interval: 10s
      timeout: 5s
      retries: 5

  smartats-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartats-web
    restart: always
    depends_on:
      smartats-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://smartats:smartatspassword@smartats-db:5432/smartats
      - ENVIRONMENT=production
      - SECRET_KEY=smartats-production-secret-replace-with-openssl-rand-hex-32
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/resumes:/app/backend/data/resumes

volumes:
  postgres_data:
