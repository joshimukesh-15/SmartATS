<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f7f6f3; }
      .surface { fill: #ffffff; stroke: #e3e0da; stroke-width: 1px; }
      .surface-alt { fill: #f0eeea; }
      .ink { fill: #14141a; font-family: -apple-system, BlinkMacSystemFont, "Geist", "Segoe UI", Roboto, sans-serif; }
      .ink-muted { fill: #62626b; font-family: -apple-system, BlinkMacSystemFont, "Geist", "Segoe UI", Roboto, sans-serif; }
      .champagne { fill: #926f18; }
      .champagne-soft { fill: #f4ecd8; }
      .chip { fill: #ffffff; stroke: #e3e0da; stroke-width: 1px; }
      .line { stroke: #e3e0da; stroke-width: 1px; }
      .btn-primary { fill: #14141a; }
      .btn-primary-text { fill: #ffffff; font-weight: 500; font-size: 14px; }
      .btn-sec { fill: #ffffff; stroke: #e3e0da; stroke-width: 1px; }
      .btn-sec-text { fill: #14141a; font-weight: 500; font-size: 14px; }
    </style>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#14141a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14141a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" class="bg"/>

  <!-- Top Nav -->
  <rect x="60" y="24" width="1080" height="56" rx="28" class="surface" filter="url(#shadow-md)"/>
  <circle cx="96" cy="52" r="8" fill="#14141a"/>
  <circle cx="106" cy="52" r="4" fill="#926f18"/>
  <text x="122" y="57" class="ink" font-size="16" font-weight="600" letter-spacing="-0.02em">SmartATS</text>
  <text x="480" y="56" class="ink-muted" font-size="14">Architecture</text>
  <text x="590" y="56" class="ink-muted" font-size="14">Scoring Engine</text>
  <text x="710" y="56" class="ink-muted" font-size="14">Benchmarks</text>
  <rect x="980" y="36" width="136" height="32" rx="16" class="btn-primary"/>
  <text x="1048" y="57" class="btn-primary-text" text-anchor="middle" font-size="13">Launch Studio</text>

  <!-- Hero Text -->
  <rect x="490" y="112" width="220" height="26" rx="13" class="champagne-soft"/>
  <circle cx="504" cy="125" r="4" class="champagne"/>
  <text x="516" y="129" class="ink" font-size="12" font-weight="500">Deterministic 4-Pillar Scoring</text>

  <text x="600" y="175" class="ink" font-size="38" font-weight="600" text-anchor="middle" letter-spacing="-0.03em">
    Explainable Candidate Intelligence
  </text>
  <text x="600" y="215" class="ink-muted" font-size="16" text-anchor="middle">
    Objective resume screening with 4-pillar multi-factor evaluation: 40% Skills, 20% Text, 25% Experience, 15% Education.
  </text>

  <!-- CTA Buttons -->
  <rect x="460" y="240" width="140" height="42" rx="10" class="btn-primary"/>
  <text x="530" y="266" class="btn-primary-text" text-anchor="middle">Open Leaderboard</text>
  <rect x="615" y="240" width="125" height="42" rx="10" class="btn-sec"/>
  <text x="677" y="266" class="btn-sec-text" text-anchor="middle">Documentation</text>

  <!-- ProductFrame Browser Container -->
  <g transform="translate(120, 310)" filter="url(#shadow-md)">
    <rect width="960" height="340" rx="14" class="surface"/>
    
    <!-- Chrome Header -->
    <rect width="960" height="42" rx="14" class="surface-alt"/>
    <rect y="30" width="960" height="12" class="surface-alt"/>
    <line x1="0" y1="42" x2="960" y2="42" class="line"/>
    <circle cx="24" cy="21" r="5" fill="#e3e0da"/>
    <circle cx="40" cy="21" r="5" fill="#e3e0da"/>
    <circle cx="56" cy="21" r="5" fill="#e3e0da"/>
    
    <!-- URL Bar -->
    <rect x="330" y="8" width="300" height="26" rx="6" class="surface"/>
    <text x="480" y="25" class="ink-muted" font-size="12" text-anchor="middle">smartats.app/studio/leaderboard</text>

    <!-- Table Header Mock -->
    <rect x="24" y="58" width="912" height="36" rx="6" class="surface-alt"/>
    <text x="44" y="81" class="ink-muted" font-size="12" font-weight="500">RANK</text>
    <text x="110" y="81" class="ink-muted" font-size="12" font-weight="500">CANDIDATE</text>
    <text x="360" y="81" class="ink-muted" font-size="12" font-weight="500">STAGE</text>
    <text x="520" y="81" class="ink-muted" font-size="12" font-weight="500">SKILLS</text>
    <text x="660" y="81" class="ink-muted" font-size="12" font-weight="500">TEXT</text>
    <text x="830" y="81" class="ink-muted" font-size="12" font-weight="500">FINAL SCORE</text>

    <!-- Candidate Row 1 -->
    <line x1="24" y1="150" x2="936" y2="150" class="line"/>
    <rect x="42" y="112" width="24" height="24" rx="6" class="btn-primary"/>
    <text x="54" y="128" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">1</text>
    
    <circle cx="124" cy="124" r="16" fill="#f0eeea"/>
    <text x="124" y="129" class="ink" font-size="12" font-weight="600" text-anchor="middle">SJ</text>
    <text x="150" y="121" class="ink" font-size="14" font-weight="600">Sarah Jenkins</text>
    <text x="150" y="137" class="ink-muted" font-size="12">6.5 yrs exp · Senior · Master's</text>

    <!-- Stage Badge -->
    <rect x="360" y="112" width="85" height="24" rx="6" fill="#f4ecd8" stroke="#d4b15a" stroke-width="1"/>
    <text x="402" y="128" class="ink" font-size="12" font-weight="500" text-anchor="middle">Interview</text>

    <!-- Pillar Points -->
    <text x="540" y="128" class="ink-muted" font-size="13" font-family="monospace">100.0%</text>
    <text x="680" y="128" class="ink-muted" font-size="13" font-family="monospace">87.5%</text>

    <!-- Final Score -->
    <text x="890" y="123" class="ink" font-size="16" font-weight="600" text-anchor="end">95.0%</text>
    <rect x="760" y="132" width="130" height="6" rx="3" fill="#e3e0da"/>
    <rect x="760" y="132" width="123" height="6" rx="3" class="champagne"/>

    <!-- Candidate Row 2 -->
    <line x1="24" y1="210" x2="936" y2="210" class="line"/>
    <rect x="42" y="172" width="24" height="24" rx="6" class="surface-alt"/>
    <text x="54" y="188" class="ink" font-size="12" font-weight="600" text-anchor="middle">2</text>
    
    <circle cx="124" cy="184" r="16" fill="#f0eeea"/>
    <text x="124" y="189" class="ink" font-size="12" font-weight="600" text-anchor="middle">AR</text>
    <text x="150" y="181" class="ink" font-size="14" font-weight="600">Alex Rivera</text>
    <text x="150" y="197" class="ink-muted" font-size="12">4.0 yrs exp · Mid-Senior · Bachelor's</text>

    <rect x="360" y="172" width="60" height="24" rx="6" class="surface-alt" stroke="#e3e0da" stroke-width="1"/>
    <text x="390" y="188" class="ink-muted" font-size="12" text-anchor="middle">New</text>

    <text x="540" y="188" class="ink-muted" font-size="13" font-family="monospace">80.0%</text>
    <text x="680" y="188" class="ink-muted" font-size="13" font-family="monospace">82.5%</text>

    <text x="890" y="183" class="ink" font-size="16" font-weight="600" text-anchor="end">85.0%</text>
    <rect x="760" y="192" width="130" height="6" rx="3" fill="#e3e0da"/>
    <rect x="760" y="192" width="110" height="6" rx="3" class="champagne"/>

    <!-- Candidate Row 3 -->
    <rect x="42" y="232" width="24" height="24" rx="6" class="surface-alt"/>
    <text x="54" y="248" class="ink" font-size="12" font-weight="600" text-anchor="middle">3</text>
    
    <circle cx="124" cy="244" r="16" fill="#f0eeea"/>
    <text x="124" y="249" class="ink" font-size="12" font-weight="600" text-anchor="middle">DC</text>
    <text x="150" y="241" class="ink" font-size="14" font-weight="600">David Chen</text>
    <text x="150" y="257" class="ink-muted" font-size="12">5.0 yrs exp · Senior · Master's</text>

    <rect x="360" y="232" width="75" height="24" rx="6" fill="#f0eeea" stroke="#e3e0da" stroke-width="1"/>
    <text x="397" y="248" class="ink" font-size="12" text-anchor="middle">Reviewing</text>

    <text x="540" y="248" class="ink-muted" font-size="13" font-family="monospace">75.0%</text>
    <text x="680" y="248" class="ink-muted" font-size="13" font-family="monospace">80.0%</text>

    <text x="890" y="243" class="ink" font-size="16" font-weight="600" text-anchor="end">78.5%</text>
    <rect x="760" y="252" width="130" height="6" rx="3" fill="#e3e0da"/>
    <rect x="760" y="252" width="98" height="6" rx="3" class="champagne"/>
  </g>
</svg>
